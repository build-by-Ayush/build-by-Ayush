name: Generate Snake

on:
workflow_dispatch:
schedule:
- cron: "0 0 * * *"

jobs:
generate:
runs-on: ubuntu-latest

```
steps:
  - name: Generate contribution snake
    uses: Platane/snk@v3
    with:
      github_user_name: build-by-Ayush
      outputs: |
        dist/github-snake.svg
        dist/github-snake-dark.svg?palette=github-dark&color_snake=2DD4BF

  - name: Publish snake
    uses: crazy-max/ghaction-github-pages@v4
    with:
      build_dir: dist
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_DIR: dist
```
