name: Generate Snake

on:
schedule:
- cron: "0 0 * * *"
workflow_dispatch:

jobs:
generate:
runs-on: ubuntu-latest

```
steps:
  - name: Generate Snake
    uses: Platane/snk@v3
    with:
      github_user_name: build-by-Ayush
      outputs: |
        output/github-snake.svg
        output/github-snake-dark.svg?palette=github-dark&color_snake=2DD4BF

  - name: Push Snake to output branch
    uses: crazy-max/ghaction-github-pages@v4
    with:
      build_dir: output
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_DIR: output
```
